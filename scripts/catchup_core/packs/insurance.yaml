# Insurance Domain pack v0 (re-artha RA-14). Thresholds are starting values the owner may override.
# Retention is left undeclared on purpose: no period is set until the owner chooses one.
domain: insurance
version: 0.1.0
confidentiality: sensitive
impact: consequential
bindings:
  local_tz: America/Los_Angeles
  insurance_cal:
    holidays: []
sources:
  - {connector: insurance_email, required: true, freshness_hours: 48}
predicates:
  - {name: policy_renewal_date, type: date, high_stakes: true, lead_days: 14, authority: [insurer_notice, email_notice],
     hint: "the date a policy renews or expires; obligation_ref: the insurer name only, e.g. example insurer"}
  - {name: premium_due_date, type: date, high_stakes: true, lead_days: 5, authority: [insurer_statement, email_notice],
     hint: "the date a premium payment is due; obligation_ref: the insurer name only, e.g. example insurer; skip quotes"}
  - {name: premium_payment_status, type: enum, values: [paid, received], resolves: premium_due_date,
     authority: [insurer_statement, email_notice],
     hint: "paid: paid in full; received: any premium payment received or posted (owner rule, amount not compared); obligation_ref: the insurer name only"}
  - {name: claim_status, type: enum, values: [open, closed], authority: [insurer_notice, email_notice],
     hint: "state only when the mail says a claim is open or closed; obligation_ref: the insurer name only"}
alert_rules:
  - {predicate: policy_renewal_date, when: "0 <= days_until <= 14", severity: P2}
  - {predicate: policy_renewal_date, when: "0 <= days_until <= 3", severity: P1}
  - {predicate: policy_renewal_date, when: "days_until < 0 and obligation_state == 'outstanding'", severity: P1}
  - {predicate: premium_due_date, when: "0 <= days_until <= 5", severity: P2}
  - {predicate: premium_due_date, when: "0 <= days_until <= 3", severity: P1}
  - {predicate: premium_due_date, when: "days_until < 0 and obligation_state == 'outstanding'", severity: P1}
  - {predicate: claim_status, when: "value == 'open'", severity: P3}
deadline_arithmetic:
  timezone: local_tz
  date_only: unspecified_unless_the_source_states_a_time
  end_dates: exclusive
  business_days: insurance_cal
  latest_useful_action: due_minus_lead_time
fixtures_dir: tests/fixtures/insurance/
